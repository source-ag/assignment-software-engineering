version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: meteo_postgres
    environment:
      POSTGRES_DB: meteo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: meteo_api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=meteo_db
      - DB_SSLMODE=disable
      - PORT=8080
      - READ_API_KEY=read-key-123
      - WRITE_API_KEY=write-key-456
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data: